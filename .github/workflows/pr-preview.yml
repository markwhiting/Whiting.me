name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pr-preview-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Disabled: PR previews are incompatible with custom domain GitHub Pages deployments
    # because actions/deploy-pages@v4 can only deploy to one path at a time.
    # This workflow would overwrite the main site deployment.
    if: false && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: pr-preview-${{ github.event.pull_request.number }}
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: |
          gem install --user-install bundler
          export PATH="$PATH:$(ruby -e 'puts Gem.user_dir')/bin"
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Build with Jekyll
        run: |
          export PATH="$PATH:$(ruby -e 'puts Gem.user_dir')/bin"
          bundle exec jekyll build --baseurl "/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}" --future
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${prNumber}`;

            const comment = `🚀 **PR Preview deployed!**

            Preview your changes: ${previewUrl}

            Built from commit: ${{ github.event.pull_request.head.sha }}`;

            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.data.find(comment =>
              comment.body.includes('🚀 **PR Preview deployed!**')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }

  cleanup:
    # Disabled: PR previews are disabled for custom domain sites
    if: false && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete environment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const envName = `pr-preview-${prNumber}`;

            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: envName
              });
              console.log(`Deleted environment: ${envName}`);
            } catch (error) {
              console.log(`Environment ${envName} may not exist or already deleted`);
            }

      - name: Comment PR closure
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            const comment = `🗑️ **PR Preview cleaned up**

            The preview deployment for this PR has been removed.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
