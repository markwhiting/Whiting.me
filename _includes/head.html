<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16x16.png' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}" />
  <link rel="manifest" href="{{ '/assets/site.webmanifest' | relative_url }}" />
  <meta name="msapplication-config" content="{{ '/browserconfig.xml' | relative_url }}" />
  {%- seo -%} <link rel="stylesheet" href="{{
    "/assets/main.css" | relative_url
  }}"> {%- feed_meta -%} {%- if jekyll.environment == 'production' and
  site.google_analytics -%} {%- include google-analytics.html -%} {%- endif -%}
  <base target="_blank" />
  <script
    defer
    src="{{ '/assets/js/section-links.js' | relative_url }}"
  ></script>

  <!-- Schema.org structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Mark E. Whiting",
    "url": "{{ site.url }}",
    "email": "{{ site.email }}",
    "image": "{{ site.url }}/assets/Headshot.jpeg",
    "jobTitle": "Chief Scientist",
    "worksFor": {
      "@type": "Organization",
      "name": "Pareto"
    },
    "affiliation": [
      {
        "@type": "Organization",
        "name": "University of Pennsylvania",
        "url": "https://www.upenn.edu"
      },
      {
        "@type": "ResearchOrganization",
        "name": "CSSLab",
        "url": "https://css.seas.upenn.edu"
      }
    ],
    "alumniOf": [
      {
        "@type": "CollegeOrUniversity",
        "name": "Carnegie Mellon University"
      },
      {
        "@type": "CollegeOrUniversity",
        "name": "KAIST"
      },
      {
        "@type": "CollegeOrUniversity",
        "name": "RMIT University"
      }
    ],
    "sameAs": [
      "https://twitter.com/{{ site.twitter_username }}",
      "https://github.com/{{ site.github_username }}",
      "https://scholar.google.com/citations?user=9BeIX-0AAAAJ",
      "https://orcid.org/0000-0002-6395-7833"
    ]
  }
  </script>
  {%- if page.url == "/" -%}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "mainEntity": {
      "@type": "Person",
      "name": "Mark E. Whiting",
      "url": "{{ site.url }}"
    }
  }
  </script>
  {%- endif -%}
</head>
