<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  <script>
  const xmlhttp = new XMLHttpRequest();
  const url = "https://api.github.com/repos/markwhiting/Whiting.me/commits/gh-pages";
  xmlhttp.onreadystatechange = function() {
    if (this.readyState === 4) {
      if (this.status === 200) {
        try {
          const commit = JSON.parse(this.responseText);
          lastUpdated(commit);
        } catch (e) {
          console.error('Failed to parse GitHub commit data:', e);
        }
      } else {
        console.log('GitHub API unavailable (status: ' + this.status + '), using fallback date');
      }
    }
  };
  xmlhttp.open("GET", url, true);
  xmlhttp.send();

  function lastUpdated(commit) {
    // Verify commit data exists
    if (!commit || !commit.commit || !commit.commit.committer || !commit.commit.committer.date) {
      console.log('Invalid commit data from GitHub API, using fallback date');
      return;
    }

    const date = new Date(commit.commit.committer.date);
    let month;
    switch (date.getMonth()) {
      case 0: month = "Jan"; break;
      case 1: month = "Feb"; break;
      case 2: month = "Mar"; break;
      case 3: month = "Apr"; break;
      case 4: month = "May"; break;
      case 5: month = "Jun"; break;
      case 6: month = "Jul"; break;
      case 7: month = "Aug"; break;
      case 8: month = "Sep"; break;
      case 9: month = "Oct"; break;
      case 10: month = "Nov"; break;
      case 11: month = "Dec"; break;
    }
    const upDate = "" + month + " " + date.getDate() + ", " + date.getFullYear();
    const commitUrl = "https://github.com/markwhiting/Whiting.me/commit/" + commit.sha;
    const linkHtml = '<a href="https://github.com/markwhiting/Whiting.me/tree/gh-pages" ></a><a href="' + commitUrl + '">' + upDate + "</a>";

    Array.from(document.getElementsByClassName('upDate')).forEach(element => {
      element.innerHTML = linkHtml;
    })
  }
  
  if (window.matchMedia){
    const body = document.getElementsByTagName("body")[0]
    const pick_color = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? `hsla(${Math.random()*360},${Math.random()*25}%,${Math.random()*20}%,1)` : `hsla(${Math.random()*360},${Math.random()*25}%,${Math.random()*20+80}%,1)`
    body.style.backgroundColor = pick_color()
    
    window
    .matchMedia('(prefers-color-scheme: dark)')
    .addEventListener('change', () => {body.style.backgroundColor = pick_color()})
  }
  </script>
    <script
    type="text/javascript"
    src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"
  ></script>

  </body>

</html>
