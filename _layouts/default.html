      <div class="wrapper">
        {{ content }}
      </div>

    {%- include footer.html -%}

  <script>
  // Client-side caching for rate limit protection
  const CACHE_KEY = 'gh_commit_cache';
  const CACHE_DURATION = 5 * 60 * 1000; // 5 minutes

  function getCachedData() {
    try {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        const { data, timestamp } = JSON.parse(cached);
        if (Date.now() - timestamp < CACHE_DURATION) {
          return data;
        }
      }
    } catch (e) {
      console.warn('Failed to read cache:', e);
    }
    return null;
  }

  function setCacheData(data) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        data: data,
        timestamp: Date.now()
      }));
    } catch (e) {
      console.warn('Failed to write cache:', e);
    }
  }

  function fetchCommitData() {
    const cached = getCachedData();
    if (cached) {
      lastUpdated(cached);
      return;
    }

    const xmlhttp = new XMLHttpRequest();
    const url = "https://api.github.com/repos/markwhiting/Whiting.me/commits/gh-pages";
    xmlhttp.onreadystatechange = function() {
      if (this.readyState === 4) {
        if (this.status === 200) {
          try {
            const commit = JSON.parse(this.responseText);
            setCacheData(commit);
            lastUpdated(commit);
          } catch (e) {
            console.error('Failed to parse GitHub commit data:', e);
          }
        } else {
          console.log(`GitHub API unavailable (status: ${this.status}), using fallback date`);
        }
      }
    };
    xmlhttp.open("GET", url, true);
    xmlhttp.send();
  }

  function lastUpdated(commit) {
    // Verify commit data exists
    if (!commit || !commit.commit || !commit.commit.committer || !commit.commit.committer.date) {
      console.log('Invalid commit data from GitHub API, using fallback date');
      return;
    }

    // Validate commit SHA format (40 hex characters)
    if (!commit.sha || !/^[0-9a-f]{40}$/i.test(commit.sha)) {
      console.warn('Invalid commit SHA format, using fallback date');
      return;
    }

    const date = new Date(commit.commit.committer.date);
    // Use toLocaleDateString for simpler month formatting
    const upDate = date.toLocaleDateString('en-US', {
      month: 'short',
      day: 'numeric',
      year: 'numeric'
    });

    const commitUrl = `https://github.com/markwhiting/Whiting.me/commit/${commit.sha}`;

    // Use safer DOM manipulation instead of innerHTML
    Array.from(document.getElementsByClassName('upDate')).forEach(element => {
      // Clear existing content
      element.textContent = '';

      // Create link to commit
      const commitLink = document.createElement('a');
      commitLink.href = commitUrl;
      commitLink.textContent = upDate;

      element.appendChild(commitLink);
    });
  }

  // Fetch commit data on page load
  fetchCommitData();

  if (window.matchMedia) {
    const body = document.getElementsByTagName("body")[0];
    const colorSchemeMedia = window.matchMedia("(prefers-color-scheme: dark)");
    const supportsLch =
      window.CSS &&
      typeof window.CSS.supports === "function" &&
      window.CSS.supports("color", "lch(50% 20 180deg)");

    const randomHue = () => Math.random() * 360;
    const randomChroma = () => Math.random() * 12;
    const randomLightness = isDarkMode =>
      isDarkMode ? Math.random() * 20 : Math.random() * 20 + 80;
    const randomSaturation = () => Math.random() * 25;

    const pickColor = () => {
      const isDarkMode = colorSchemeMedia.matches;

      if (supportsLch) {
        return `lch(${randomLightness(isDarkMode)}% ${randomChroma()} ${randomHue()}deg)`;
      }

      return isDarkMode
        ? `hsla(${randomHue()},${randomSaturation()}%,${Math.random() * 20}%,1)`
        : `hsla(${randomHue()},${randomSaturation()}%,${Math.random() * 20 + 80}%,1)`;
    };

    const applyBackgroundColor = () => {
      body.style.backgroundColor = pickColor();
    };

    applyBackgroundColor();

    if (typeof colorSchemeMedia.addEventListener === "function") {
      colorSchemeMedia.addEventListener("change", applyBackgroundColor);
    } else if (typeof colorSchemeMedia.addListener === "function") {
      colorSchemeMedia.addListener(applyBackgroundColor);
    }
  }
  </script>
